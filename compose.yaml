services:
  worker:
    build: .
    environment:
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:?Defina a URL do LiteLLM}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?Configure a chave do LiteLLM}
      IPTU_RUN_WORKER: ${IPTU_RUN_WORKER:-1}
      IPTU_PAGE_WORKERS: ${IPTU_PAGE_WORKERS:-32}
      IPTU_BATCH_MODEL: ${IPTU_BATCH_MODEL:-qwen3.8-27b-fast}
      IPTU_BATCH_MODEL_FALLBACK: ${IPTU_BATCH_MODEL_FALLBACK:-}
      IPTU_USUARIOS: ${IPTU_USUARIOS:-}
      IPTU_API_TOKEN: ${IPTU_API_TOKEN:-}
      IPTU_LOTES_SIMULTANEOS: ${IPTU_LOTES_SIMULTANEOS:-3}
      IPTU_EXERCICIO: ${IPTU_EXERCICIO:-2027}
      IPTU_SALARIO_MINIMO_CENTAVOS: ${IPTU_SALARIO_MINIMO_CENTAVOS:-162100}
      IPTU_PRAZO_INICIO: ${IPTU_PRAZO_INICIO:-}
      IPTU_PRAZO_FIM: ${IPTU_PRAZO_FIM:-}
      IPTU_LLM_TIMEOUT: ${IPTU_LLM_TIMEOUT:-180}
      IPTU_LLM_TIMEOUT_RAPIDO: ${IPTU_LLM_TIMEOUT_RAPIDO:-60}
      IPTU_DETAIL_MODEL: ${IPTU_DETAIL_MODEL:-}
      IPTU_VERIFY_MODEL: ${IPTU_VERIFY_MODEL:-}
      SIL_BASE_URL: ${SIL_BASE_URL:-https://interface-sandbox.siltecnologia.com.br/v1}
      SIL_CLIENT_ID: ${SIL_CLIENT_ID:-}
      SIL_CLIENT_SECRET: ${SIL_CLIENT_SECRET:-}
      SIL_SCOPE: ${SIL_SCOPE:-pmfranca}
      IPTU_ADMIN_USER: ${IPTU_ADMIN_USER:-iptu}
      IPTU_ADMIN_PASSWORD: ${IPTU_ADMIN_PASSWORD:?Configure a senha do painel}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).close()"]
      interval: 30s
      timeout: 4s
      retries: 3
    read_only: true
    volumes:
      - iptu_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  iptu_data:
