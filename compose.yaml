services:
  worker:
    build: .
    environment:
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:?Defina a URL do LiteLLM}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?Configure a chave do LiteLLM}
      IPTU_PAGE_WORKERS: ${IPTU_PAGE_WORKERS:-4}
      IPTU_BATCH_MODEL: ${IPTU_BATCH_MODEL:-qwen3.8-27b-fast}
      IPTU_ADMIN_USER: ${IPTU_ADMIN_USER:-iptu}
      IPTU_ADMIN_PASSWORD: ${IPTU_ADMIN_PASSWORD:?Configure a senha do painel}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).close()"]
      interval: 30s
      timeout: 4s
      retries: 3
    read_only: true
    volumes:
      - iptu_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  iptu_data:
